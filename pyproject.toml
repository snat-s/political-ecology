[project]
name = "political-ecology"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["modal==1.5.5", "python-dotenv>=1.1,<2"]

[dependency-groups]
dev = ["ruff>=0.12", "pytest>=8"]

[tool.ruff]
line-length = 80
extend-exclude = [".agents", "logs", ".podman-storage"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
